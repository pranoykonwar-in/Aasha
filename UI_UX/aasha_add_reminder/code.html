<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aasha - Add Reminder</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed-dim": "#a1d494",
                      "inverse-surface": "#27313f",
                      "tertiary-fixed-dim": "#c8c8b0",
                      "surface-variant": "#d9e3f6",
                      "primary-fixed": "#bcf0ae",
                      "inverse-on-surface": "#eaf1ff",
                      "on-tertiary-container": "#c3c4ac",
                      "surface-bright": "#f8f9ff",
                      "tertiary-fixed": "#e4e4cc",
                      "on-error": "#ffffff",
                      "surface-tint": "#3b6934",
                      "on-background": "#121c2a",
                      "on-tertiary-fixed": "#1b1d0e",
                      "secondary-container": "#fe932c",
                      "error-container": "#ffdad6",
                      "secondary-fixed": "#ffdcc3",
                      "on-primary-fixed": "#002201",
                      "inverse-primary": "#a1d494",
                      "surface-container-low": "#eff4ff",
                      "primary": "#154212",
                      "background": "#f8f9ff",
                      "secondary": "#904d00",
                      "surface-container": "#e6eeff",
                      "on-surface-variant": "#42493e",
                      "error": "#ba1a1a",
                      "on-error-container": "#93000a",
                      "on-secondary": "#ffffff",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed": "#2f1500",
                      "primary-container": "#2d5a27",
                      "secondary-fixed-dim": "#ffb77d",
                      "on-primary-container": "#9dd090",
                      "surface": "#f8f9ff",
                      "on-secondary-container": "#663500",
                      "tertiary": "#393a29",
                      "on-secondary-fixed-variant": "#6e3900",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#23501e",
                      "surface-container-highest": "#d9e3f6",
                      "tertiary-container": "#50513f",
                      "surface-container-high": "#dee9fc",
                      "outline": "#72796e",
                      "outline-variant": "#c2c9bb",
                      "on-primary": "#ffffff",
                      "on-tertiary-fixed-variant": "#474836",
                      "surface-dim": "#d0dbed",
                      "on-surface": "#121c2a"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-md": "24px",
                      "margin-mobile": "20px",
                      "stack-lg": "48px",
                      "margin-desktop": "64px",
                      "stack-sm": "12px",
                      "gutter": "24px",
                      "touch-target-min": "56px"
              },
              "fontFamily": {
                      "label-lg": [
                              "Atkinson Hyperlegible Next"
                      ],
                      "headline-lg": [
                              "Plus Jakarta Sans"
                      ],
                      "headline-lg-mobile": [
                              "Plus Jakarta Sans"
                      ],
                      "button": [
                              "Plus Jakarta Sans"
                      ],
                      "body-md": [
                              "Atkinson Hyperlegible Next"
                      ],
                      "headline-md": [
                              "Plus Jakarta Sans"
                      ],
                      "body-lg": [
                              "Atkinson Hyperlegible Next"
                      ]
              },
              "fontSize": {
                      "label-lg": [
                              "18px",
                              {
                                      "lineHeight": "24px",
                                      "letterSpacing": "0.01em",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-lg-mobile": [
                              "28px",
                              {
                                      "lineHeight": "36px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "700"
                              }
                      ],
                      "button": [
                              "20px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-md": [
                              "18px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-lg": [
                              "20px",
                              {
                                      "lineHeight": "30px",
                                      "fontWeight": "400"
                              }
                      ]
              }
      },
          },
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-tap-highlight-color: transparent;
        }
        
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .touch-target {
            min-height: 56px;
            min-width: 56px;
        }

        .card-elevation {
            border: 1px solid theme('colors.outline-variant');
            background-color: theme('colors.surface-container-lowest');
        }

        .input-active:focus-within {
            border-width: 3px;
            border-color: theme('colors.secondary-container');
        }
    </style>
</head>
<body class="antialiased min-h-screen pb-stack-lg">
<!-- Top Navigation (Transactional, no shell nav) -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim border-b border-outline-variant z-50">
<div class="flex justify-between items-center px-margin-mobile h-[72px]">
<button aria-label="Go back" class="touch-target flex items-center justify-center text-primary dark:text-primary-fixed rounded-full hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">arrow_back</span>
</button>
<div class="flex-1 text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed">Add Reminder</h1>
</div>
<div class="w-[56px]"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="px-margin-mobile max-w-2xl mx-auto pt-stack-md">
<div class="mb-stack-lg text-center">
<p class="font-body-lg text-body-lg text-on-surface-variant">Let's make sure you don't forget.</p>
</div>
<div class="mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-primary mb-stack-sm">What do you want to remember?</h2>
<div class="grid grid-cols-2 gap-gutter">
<!-- Selected Card -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl touch-target bg-primary-container text-on-primary-container border-2 border-primary-container scale-95 transition-transform duration-150">
<span class="material-symbols-outlined mb-2" style="font-size: 32px;">medication</span>
<span class="font-label-lg text-label-lg">Medicine</span>
</button>
<!-- Unselected Cards -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl touch-target card-elevation text-on-surface-variant hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined mb-2" style="font-size: 32px;">water_drop</span>
<span class="font-label-lg text-label-lg">Hydration</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-xl touch-target card-elevation text-on-surface-variant hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined mb-2" style="font-size: 32px;">directions_walk</span>
<span class="font-label-lg text-label-lg">Daily Activity</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-xl touch-target card-elevation text-on-surface-variant hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined mb-2" style="font-size: 32px;">calendar_month</span>
<span class="font-label-lg text-label-lg">Appointment</span>
</button>
</div>
</div>
<!-- Medicine Specific Fields (Visible because Medicine is selected) -->
<div class="mb-stack-lg bg-surface-container rounded-xl p-6 card-elevation border-l-4 border-l-primary-container">
<h3 class="font-headline-md text-headline-md text-primary mb-stack-sm flex items-center gap-2">
<span class="material-symbols-outlined">prescriptions</span>
                Medicine Details
            </h3>
<div class="mb-stack-md">
<label class="block font-label-lg text-label-lg text-on-background mb-2" for="medicine-name">Medicine name</label>
<div class="relative input-active rounded-lg overflow-hidden border border-outline-variant bg-surface-container-lowest">
<input class="w-full touch-target px-4 py-3 font-body-lg text-body-lg text-on-background bg-transparent focus:outline-none placeholder:text-outline" id="medicine-name" placeholder="e.g., Blood Pressure Pills" type="text"/>
</div>
</div>
<div class="mb-stack-md">
<label class="block font-label-lg text-label-lg text-on-background mb-2" for="dosage">Dosage</label>
<div class="relative input-active rounded-lg overflow-hidden border border-outline-variant bg-surface-container-lowest">
<input class="w-full touch-target px-4 py-3 font-body-lg text-body-lg text-on-background bg-transparent focus:outline-none placeholder:text-outline" id="dosage" placeholder="e.g., 1 tablet" type="text"/>
</div>
</div>
</div>
<div class="mb-stack-lg">
<label class="block font-headline-md text-headline-md text-primary mb-stack-sm" for="reminder-name">Reminder name</label>
<div class="relative input-active rounded-lg overflow-hidden border border-outline-variant bg-surface-container-lowest">
<input class="w-full touch-target px-4 py-3 font-body-lg text-body-lg text-on-background bg-transparent focus:outline-none placeholder:text-outline" id="reminder-name" type="text" value="Morning medicine"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mb-stack-lg">
<!-- Time Selector -->
<div>
<label class="block font-headline-md text-headline-md text-primary mb-stack-sm">Time</label>
<button class="w-full flex items-center justify-between p-4 rounded-xl touch-target card-elevation hover:bg-surface-bright transition-colors">
<span class="font-body-lg text-body-lg text-on-background">9:00 AM</span>
<span class="material-symbols-outlined text-primary">schedule</span>
</button>
</div>
<!-- Date Selector -->
<div>
<label class="block font-headline-md text-headline-md text-primary mb-stack-sm">Date</label>
<button class="w-full flex items-center justify-between p-4 rounded-xl touch-target card-elevation hover:bg-surface-bright transition-colors">
<span class="font-body-lg text-body-lg text-on-background">Today</span>
<span class="material-symbols-outlined text-primary">event</span>
</button>
</div>
</div>
<div class="mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-primary mb-stack-sm">Repeat</h2>
<div class="flex flex-col gap-3">
<label class="flex items-center p-4 rounded-xl touch-target card-elevation hover:bg-surface-bright cursor-pointer">
<input class="w-6 h-6 text-primary border-outline-variant focus:ring-primary focus:ring-offset-background mr-4" name="repeat" type="radio"/>
<span class="font-body-lg text-body-lg text-on-background">Once</span>
</label>
<label class="flex items-center p-4 rounded-xl touch-target bg-surface-container border-2 border-primary-container cursor-pointer">
<input checked="" class="w-6 h-6 text-primary border-outline-variant focus:ring-primary focus:ring-offset-background mr-4" name="repeat" type="radio"/>
<span class="font-body-lg text-body-lg text-on-background font-semibold">Every day</span>
</label>
<label class="flex items-center p-4 rounded-xl touch-target card-elevation hover:bg-surface-bright cursor-pointer">
<input class="w-6 h-6 text-primary border-outline-variant focus:ring-primary focus:ring-offset-background mr-4" name="repeat" type="radio"/>
<span class="font-body-lg text-body-lg text-on-background">Selected days</span>
</label>
</div>
</div>
<div class="mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-primary mb-stack-sm">Remind me</h2>
<select class="w-full touch-target px-4 py-3 rounded-xl card-elevation font-body-lg text-body-lg text-on-background focus:outline-none focus:ring-3 focus:ring-secondary-container border-outline-variant appearance-none">
<option>At the time</option>
<option>5 minutes before</option>
<option>10 minutes before</option>
<option>30 minutes before</option>
</select>
</div>
<!-- Voice Alternative -->
<div class="mb-stack-lg flex flex-col items-center justify-center p-6 bg-surface-container-low rounded-xl border border-surface-variant">
<p class="font-body-md text-body-md text-on-surface-variant mb-4 text-center">Tell Aasha what you want to remember.</p>
<button class="flex items-center justify-center gap-2 bg-secondary-container text-on-secondary-container touch-target px-6 rounded-full font-button text-button shadow-sm hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
                Speak instead
            </button>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-stack-lg">
<button class="w-full touch-target bg-primary text-on-primary rounded-full font-button text-button shadow-md hover:opacity-90 transition-opacity flex items-center justify-center">
                Save Reminder
            </button>
<button class="w-full touch-target border-2 border-primary text-primary rounded-full font-button text-button hover:bg-primary/5 transition-colors flex items-center justify-center">
                Cancel
            </button>
</div>
<div class="mt-stack-md text-center flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">check_circle</span>
<span class="font-body-md text-body-md">Your reminder will be saved on this device.</span>
</div>
</main>
</body></html>
