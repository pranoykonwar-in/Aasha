<script>
        // Simple micro-interaction for answer selection
        document.querySelectorAll('.pattern-card').forEach(card => {
            card.addEventListener('click', function() {
                // Remove selected state from all
                document.querySelectorAll('.pattern-card').forEach(c => {
                    c.classList.remove('bg-surface-container-high', 'border-primary', 'shadow-md');
                    c.classList.add('bg-surface-container-lowest', 'border-outline-variant');
                });
                
                // Add selected state to clicked
                this.classList.remove('bg-surface-container-lowest', 'border-outline-variant');
                this.classList.add('bg-surface-container-high', 'border-primary', 'shadow-md');
                
                // Visual feedback for correctness (mock logic: first one is correct)
                if(this === document.querySelectorAll('.pattern-card')[0]) {
                    setTimeout(() => {
                        this.classList.replace('bg-surface-container-high', 'bg-primary-fixed');
                        this.classList.replace('border-primary', 'border-primary-container');
                    }, 300);
                }
            });
        });
