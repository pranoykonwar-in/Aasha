<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aasha - Reminder Alert</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#9dd090",
                        "tertiary": "#393a29",
                        "surface-dim": "#d0dbed",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#ffb77d",
                        "on-tertiary-container": "#c3c4ac",
                        "on-surface": "#121c2a",
                        "surface-container": "#e6eeff",
                        "error": "#ba1a1a",
                        "primary-fixed": "#bcf0ae",
                        "inverse-primary": "#a1d494",
                        "outline": "#72796e",
                        "on-tertiary-fixed-variant": "#474836",
                        "background": "#f8f9ff",
                        "on-tertiary-fixed": "#1b1d0e",
                        "primary-container": "#2d5a27",
                        "tertiary-fixed": "#e4e4cc",
                        "primary": "#154212",
                        "inverse-surface": "#27313f",
                        "surface-tint": "#3b6934",
                        "on-primary-fixed-variant": "#23501e",
                        "secondary-container": "#fe932c",
                        "surface-container-high": "#dee9fc",
                        "inverse-on-surface": "#eaf1ff",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#d9e3f6",
                        "tertiary-container": "#50513f",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "on-secondary-fixed-variant": "#6e3900",
                        "surface": "#f8f9ff",
                        "on-surface-variant": "#42493e",
                        "secondary-fixed": "#ffdcc3",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#c8c8b0",
                        "surface-variant": "#d9e3f6",
                        "on-background": "#121c2a",
                        "outline-variant": "#c2c9bb",
                        "surface-bright": "#f8f9ff",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#a1d494",
                        "secondary": "#904d00",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#663500",
                        "on-secondary-fixed": "#2f1500",
                        "on-primary-fixed": "#002201",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "24px",
                        "margin-mobile": "20px",
                        "margin-desktop": "64px",
                        "stack-sm": "12px",
                        "gutter": "24px",
                        "stack-lg": "48px",
                        "touch-target-min": "56px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-lg": ["Atkinson Hyperlegible Next"],
                        "body-lg": ["Atkinson Hyperlegible Next"],
                        "button": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Atkinson Hyperlegible Next"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-lg": ["18px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-lg": ["20px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "button": ["20px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-lg">
<!-- Top Navigation (Shell suppressed for this transactional alert view, but minimal top bar kept for structure if needed, or fully hidden) -->
<!-- Fully suppressed top bar as this is a full-screen alert -->
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center px-margin-mobile md:px-margin-desktop py-stack-lg max-w-2xl mx-auto w-full pb-32">
<!-- Header -->
<header class="w-full text-center mb-stack-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-stack-sm">
                It's time for your reminder
            </h1>
<div class="flex items-center justify-center gap-2 text-on-surface-variant bg-surface-container-low py-2 px-4 rounded-full inline-flex mx-auto">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">medication</span>
<span class="font-label-lg text-label-lg">Medicine</span>
</div>
</header>
<!-- Main Card -->
<div class="w-full bg-surface-container-lowest border border-outline-variant/10 rounded-xl p-stack-md shadow-sm mb-stack-lg flex flex-col items-center text-center">
<div class="w-24 h-24 bg-surface-container flex items-center justify-center rounded-full mb-stack-sm">
<span class="material-symbols-outlined text-6xl text-primary" style="font-variation-settings: 'FILL' 1;">pill</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Morning Medicine</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-sm">
                Take 1 tablet
            </p>
<div class="font-headline-md text-headline-md text-secondary-container bg-surface-variant px-6 py-2 rounded-lg inline-block">
                9:00 AM
            </div>
</div>
<!-- Actions Container -->
<div class="w-full flex flex-col gap-stack-sm">
<!-- Primary Action -->
<button class="w-full min-h-[72px] bg-primary text-on-primary rounded-xl flex items-center justify-center gap-3 font-button text-button shadow-sm active:scale-[0.98] transition-transform">
<span>Done</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
<!-- Secondary Actions -->
<div class="flex gap-2">
<button class="flex-1 min-h-[56px] border-2 border-primary text-primary rounded-xl font-label-lg text-label-lg active:bg-surface-container-low transition-colors">
                    +10m
                </button>
<button class="flex-1 min-h-[56px] border-2 border-primary text-primary rounded-xl font-label-lg text-label-lg active:bg-surface-container-low transition-colors">
                    +30m
                </button>
<button class="flex-1 min-h-[56px] border-2 border-primary text-primary rounded-xl font-label-lg text-label-lg active:bg-surface-container-low transition-colors">
                    +1h
                </button>
</div>
<button class="w-full min-h-[56px] text-on-surface-variant font-label-lg text-label-lg underline active:text-primary transition-colors">
                Remind Me Later Options
            </button>
</div>
<!-- Footer / Support Elements -->
<div class="w-full mt-stack-lg flex flex-col items-center gap-stack-sm">
<!-- Voice Help -->
<button class="w-full min-h-[72px] bg-surface-container text-on-surface flex items-center justify-center gap-3 rounded-xl active:bg-surface-container-high transition-colors">
<div class="bg-secondary-container text-on-secondary-container p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<div class="flex flex-col text-left">
<span class="font-label-lg text-label-lg">Ask Aasha</span>
<span class="font-body-md text-body-md text-on-surface-variant">Need help?</span>
</div>
</button>
<!-- Indicators -->
<div class="flex flex-col items-center gap-2 mt-stack-md text-on-surface-variant opacity-80">
<div class="flex items-center gap-2 font-body-md text-body-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<span>Aasha can read this reminder aloud</span>
</div>
<div class="flex items-center gap-2 font-body-md text-body-md">
<span class="material-symbols-outlined text-sm">cloud_done</span>
<span>Reminder available offline</span>
</div>
</div>
</div>
</main>
</body></html>
