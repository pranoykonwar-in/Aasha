<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aasha - Daily Routine Recall Game</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-container": "#fe932c",
                      "outline": "#72796e",
                      "surface-tint": "#3b6934",
                      "surface": "#f8f9ff",
                      "surface-dim": "#d0dbed",
                      "surface-bright": "#f8f9ff",
                      "on-secondary-container": "#663500",
                      "surface-container-highest": "#d9e3f6",
                      "on-background": "#121c2a",
                      "surface-container-high": "#dee9fc",
                      "on-primary": "#ffffff",
                      "primary-container": "#2d5a27",
                      "on-primary-fixed": "#002201",
                      "on-tertiary-fixed-variant": "#474836",
                      "tertiary-fixed-dim": "#c8c8b0",
                      "on-error": "#ffffff",
                      "secondary": "#904d00",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "error": "#ba1a1a",
                      "on-secondary-fixed-variant": "#6e3900",
                      "on-secondary": "#ffffff",
                      "primary-fixed": "#bcf0ae",
                      "surface-container-low": "#eff4ff",
                      "primary-fixed-dim": "#a1d494",
                      "on-secondary-fixed": "#2f1500",
                      "on-surface": "#121c2a",
                      "inverse-surface": "#27313f",
                      "surface-variant": "#d9e3f6",
                      "on-primary-fixed-variant": "#23501e",
                      "on-primary-container": "#9dd090",
                      "background": "#f8f9ff",
                      "tertiary": "#393a29",
                      "secondary-fixed": "#ffdcc3",
                      "tertiary-container": "#50513f",
                      "on-tertiary-container": "#c3c4ac",
                      "outline-variant": "#c2c9bb",
                      "primary": "#154212",
                      "error-container": "#ffdad6",
                      "surface-container": "#e6eeff",
                      "inverse-primary": "#a1d494",
                      "on-error-container": "#93000a",
                      "on-surface-variant": "#42493e",
                      "on-tertiary-fixed": "#1b1d0e",
                      "inverse-on-surface": "#eaf1ff",
                      "secondary-fixed-dim": "#ffb77d",
                      "tertiary-fixed": "#e4e4cc"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-sm": "12px",
                      "margin-mobile": "20px",
                      "margin-desktop": "64px",
                      "stack-md": "24px",
                      "gutter": "24px",
                      "touch-target-min": "56px",
                      "stack-lg": "48px"
              },
              "fontFamily": {
                      "headline-md": [
                              "Plus Jakarta Sans"
                      ],
                      "body-lg": [
                              "Atkinson Hyperlegible Next"
                      ],
                      "headline-lg": [
                              "Plus Jakarta Sans"
                      ],
                      "headline-lg-mobile": [
                              "Plus Jakarta Sans"
                      ],
                      "button": [
                              "Plus Jakarta Sans"
                      ],
                      "body-md": [
                              "Atkinson Hyperlegible Next"
                      ],
                      "label-lg": [
                              "Atkinson Hyperlegible Next"
                      ]
              },
              "fontSize": {
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-lg": [
                              "20px",
                              {
                                      "lineHeight": "30px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-lg-mobile": [
                              "28px",
                              {
                                      "lineHeight": "36px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "700"
                              }
                      ],
                      "button": [
                              "20px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-md": [
                              "18px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-lg": [
                              "18px",
                              {
                                      "lineHeight": "24px",
                                      "letterSpacing": "0.01em",
                                      "fontWeight": "600"
                              }
                      ]
              }
            },
          }
        }
      </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen pb-safe md:pb-0 font-body-lg">
<!-- Top Navigation for Game/Task focus - Simplified, no main nav items -->
<header class="bg-surface dark:bg-surface-dim border-b border-outline-variant/10 w-full top-0 sticky z-50 flex justify-between items-center h-[72px] px-margin-mobile md:px-margin-desktop shadow-sm">
<div class="flex items-center gap-4">
<button aria-label="Back to Games" class="flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-95 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-bold text-primary dark:text-primary-fixed">
                Aasha
            </span>
</div>
<button aria-label="Pause Game" class="flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-95 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
</header>
<main class="max-w-4xl mx-auto px-margin-mobile md:px-margin-desktop py-stack-md flex flex-col gap-stack-lg">
<!-- Header Section -->
<section class="flex flex-col gap-stack-sm text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">Daily Routine Recall</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Can you remember your daily routine?</p>
<div class="flex justify-center items-center mt-4">
<span class="bg-surface-container-high text-primary px-6 py-2 rounded-full font-label-lg text-label-lg">Round 1 of 5</span>
</div>
<div class="mt-stack-sm flex justify-center">
<button class="flex items-center gap-2 bg-secondary-container text-on-secondary-container px-6 py-4 rounded-xl min-h-[56px] hover:bg-secondary-fixed-dim transition-colors shadow-sm active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
<span class="font-button text-button">Hear Instructions</span>
</button>
</div>
</section>
<!-- Main Game Area -->
<section class="flex flex-col gap-stack-md">
<!-- Cards Grid -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-gutter">
<!-- Card 1 -->
<button aria-label="Select Brush teeth" class="bg-surface-container-lowest border border-outline-variant/10 rounded-xl p-4 flex flex-col items-center justify-center gap-4 hover:bg-surface-container-low transition-colors shadow-sm min-h-[160px] active:scale-95">
<div class="w-20 h-20 bg-surface-container rounded-full flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 0;">dentistry</span>
</div>
<span class="font-headline-md text-headline-md text-center">Brush teeth</span>
</button>
<!-- Card 2 -->
<button aria-label="Select Have breakfast" class="bg-surface-container-lowest border border-outline-variant/10 rounded-xl p-4 flex flex-col items-center justify-center gap-4 hover:bg-surface-container-low transition-colors shadow-sm min-h-[160px] active:scale-95">
<div class="w-20 h-20 bg-surface-container rounded-full flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 0;">restaurant</span>
</div>
<span class="font-headline-md text-headline-md text-center">Have breakfast</span>
</button>
<!-- Card 3 -->
<button aria-label="Select Take medicine" class="bg-surface-container-lowest border border-outline-variant/10 rounded-xl p-4 flex flex-col items-center justify-center gap-4 hover:bg-surface-container-low transition-colors shadow-sm min-h-[160px] active:scale-95">
<div class="w-20 h-20 bg-surface-container rounded-full flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 0;">medication</span>
</div>
<span class="font-headline-md text-headline-md text-center">Take medicine</span>
</button>
<!-- Card 4 -->
<button aria-label="Select Wake up" class="bg-surface-container-lowest border border-outline-variant/10 rounded-xl p-4 flex flex-col items-center justify-center gap-4 hover:bg-surface-container-low transition-colors shadow-sm min-h-[160px] active:scale-95">
<div class="w-20 h-20 bg-surface-container rounded-full flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 0;">bed</span>
</div>
<span class="font-headline-md text-headline-md text-center">Wake up</span>
</button>
</div>
</section>
<!-- Recall Task Area -->
<section class="bg-surface-container-low rounded-xl p-stack-md flex flex-col gap-stack-md mt-stack-md">
<div class="flex flex-col gap-2">
<h2 class="font-headline-md text-headline-md text-primary">Your Daily Routine</h2>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">info</span>
                    Your caregiver can personalize these activities.
                </p>
</div>
<div class="flex flex-col gap-4">
<!-- Slot 1 -->
<div class="flex items-center gap-4 bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/20 shadow-sm min-h-[80px]">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center font-headline-md text-headline-md text-on-surface-variant flex-shrink-0">
                        1
                    </div>
<div class="flex-grow border-2 border-dashed border-outline-variant/40 rounded-lg h-16 flex items-center justify-center text-on-surface-variant/50 font-body-lg text-body-lg">
                        Tap an activity above to place here
                    </div>
</div>
<!-- Slot 2 -->
<div class="flex items-center gap-4 bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/20 shadow-sm min-h-[80px]">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center font-headline-md text-headline-md text-on-surface-variant flex-shrink-0">
                        2
                    </div>
<div class="flex-grow border-2 border-dashed border-outline-variant/40 rounded-lg h-16 flex items-center justify-center">
</div>
</div>
<!-- Slot 3 -->
<div class="flex items-center gap-4 bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/20 shadow-sm min-h-[80px]">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center font-headline-md text-headline-md text-on-surface-variant flex-shrink-0">
                        3
                    </div>
<div class="flex-grow border-2 border-dashed border-outline-variant/40 rounded-lg h-16 flex items-center justify-center">
</div>
</div>
<!-- Slot 4 -->
<div class="flex items-center gap-4 bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/20 shadow-sm min-h-[80px]">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center font-headline-md text-headline-md text-on-surface-variant flex-shrink-0">
                        4
                    </div>
<div class="flex-grow border-2 border-dashed border-outline-variant/40 rounded-lg h-16 flex items-center justify-center">
</div>
</div>
</div>
</section>
</main>
</body></html>
